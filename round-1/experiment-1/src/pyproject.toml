[project]
name = "safety-readout-screen"
version = "1.0.0"
description = "Pre-registered head-to-head screen of five cheap safety readouts against three baselines on 22 HuggingFace checkpoints."
requires-python = ">=3.12"

# Every dependency is pinned to the EXACT version resolved in .venv for the run that
# produced method_out.json (73 packages, from `uv pip freeze`). The full
# transitive closure is pinned, not just the direct imports, so the numeric results
# are reproducible rather than merely re-runnable.
#
# torch is pinned to the CUDA 12.4 build (2.6.0+cu124), which does NOT resolve from
# PyPI -- it needs the PyTorch index declared in [[tool.uv.index]] below. torch 2.6.0
# is the known-good version on this stack; torch 2.13's Triton requires a C compiler.
#
# Reproduce with:
#   uv venv .venv --python=3.12
#   uv pip install --python .venv/bin/python torch==2.6.0 \
#       --index-url https://download.pytorch.org/whl/cu124
#   uv pip install --python .venv/bin/python -r <(uv pip compile pyproject.toml)
dependencies = [
  "accelerate==1.15.0",
  "aiohappyeyeballs==2.7.1",
  "aiohttp==3.14.3",
  "aiosignal==1.4.0",
  "annotated-doc==0.0.5",
  "anyio==4.15.1",
  "attrs==26.1.0",
  "certifi==2026.7.22",
  "click==8.5.0",
  "contourpy==1.4.0",
  "cycler==0.12.1",
  "filelock==3.32.3",
  "fonttools==4.65.0",
  "frozenlist==1.8.0",
  "fsspec==2026.7.0",
  "h11==0.16.0",
  "hf-xet==1.6.0",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "huggingface-hub==1.32.0",
  "idna==3.20",
  "jinja2==3.1.6",
  "kiwisolver==1.5.1",
  "loguru==0.7.3",
  "markdown-it-py==4.2.0",
  "markupsafe==3.0.3",
  "matplotlib==3.11.2",
  "mdurl==0.1.2",
  "mpmath==1.3.0",
  "multidict==6.9.0",
  "networkx==3.6.1",
  "numpy==2.5.3",
  "nvidia-cublas-cu12==12.4.5.8",
  "nvidia-cuda-cupti-cu12==12.4.127",
  "nvidia-cuda-nvrtc-cu12==12.4.127",
  "nvidia-cuda-runtime-cu12==12.4.127",
  "nvidia-cudnn-cu12==9.1.0.70",
  "nvidia-cufft-cu12==11.2.1.3",
  "nvidia-curand-cu12==10.3.5.147",
  "nvidia-cusolver-cu12==11.6.1.9",
  "nvidia-cusparse-cu12==12.3.1.170",
  "nvidia-cusparselt-cu12==0.6.2",
  "nvidia-nccl-cu12==2.21.5",
  "nvidia-nvjitlink-cu12==12.4.127",
  "nvidia-nvtx-cu12==12.4.127",
  "packaging==26.3",
  "pandas==3.0.6",
  "pillow==12.3.0",
  "propcache==0.5.4",
  "protobuf==7.36.2",
  "psutil==7.2.2",
  "pygments==2.21.0",
  "pyparsing==3.3.2",
  "python-dateutil==2.9.0.post0",
  "pyyaml==6.0.3",
  "regex==2026.9.10",
  "rich==15.0.0",
  "safetensors==0.8.0",
  "scipy==1.18.1",
  "sentencepiece==0.2.2",
  "setuptools==78.1.0",
  "shellingham==1.5.4",
  "six==1.17.0",
  "sympy==1.13.1",
  "tenacity==9.1.4",
  "tokenizers==0.23.2",
  "torch==2.6.0+cu124",
  "tqdm==4.70.1",
  "transformers==5.17.0",
  "triton==3.2.0",
  "typer==0.27.2",
  "typing-extensions==4.16.0",
  "yarl==1.25.1",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[tool.aii]
# Hardware the pinned stack was exercised on. Checkpoints 1-17 ran on the first box;
# the run was interrupted and resumed for checkpoints 18-23 plus Phases E-F on the second.
gpus = ["NVIDIA RTX 2000 Ada (16.7 GB)", "NVIDIA RTX A4500 (20.5 GB)"]
entrypoints = ["build_inputs.py", "build_roster.py", "method.py", "figures.py", "posthoc.py", "finalize.py"]
frozen_metric_files = ["candidates.py", "groundtruth.py", "analysis.py", "core.py", "corpora.py"]
