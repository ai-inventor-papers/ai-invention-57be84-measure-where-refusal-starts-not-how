    "filelock==4.0.1",
    "frozenlist==1.8.0",
    "fsspec==2026.6.0",
    "h11==0.16.0",
    "hf-xet==1.6.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "huggingface-hub==1.32.0",
    "idna==3.20",
    "joblib==1.6.0",
    "jsonschema-specifications==2025.9.1",
    "jsonschema==4.26.0",
